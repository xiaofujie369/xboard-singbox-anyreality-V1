name: CI and image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install requests
      - run: python -m py_compile sync/*.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh update.sh rollback.sh uninstall.sh sync/*.sh tests/integration.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x install.sh update.sh rollback.sh uninstall.sh sync/*.sh tests/integration.sh
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: docker build -t xboard-sing-box:test sing-box
      - run: bash tests/integration.sh xboard-sing-box:test
  image:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sing-box
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/xiaofujie369/xboard-singbox-anyreality-v1:latest
            ghcr.io/xiaofujie369/xboard-singbox-anyreality-v1:1.1.0
            ghcr.io/xiaofujie369/xboard-singbox-anyreality-v1:sing-box-1.14.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
